[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "superred-spb"
version = "1.2.0"
description = "Self-Poisoning Bench (SPB) for superred: a home-assistant agent with persistent, policy-governed memory as a Target, and memory-injection tasks with three-metric grading as a Claim."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [{ name = "Ivan Verbovoy", email = "ivanverbovoy@gmail.com" }]
keywords = ["superred", "red-teaming", "agent-memory", "memory-poisoning", "provenance", "benchmark"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Security",
]
dependencies = ["superred>=0.3.0"]

[project.optional-dependencies]
attackers = ["superred-optimizer-minja>=0.1.0", "superred-optimizer-goal-passthrough>=0.1.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.urls]
Repository = "https://github.com/iverbovoy/self-poisoning-bench"
Paper = "https://doi.org/10.5281/zenodo.21994003"

[tool.hatch.build.targets.wheel]
packages = ["src/spb_target", "src/spb_claim"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
